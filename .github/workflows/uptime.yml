name: Έλεγχος λειτουργίας site

# Κάθε 30 λεπτά ελέγχει ότι ο Τιπούκειτος απαντά.
# Αν πέσει, η εκτέλεση αποτυγχάνει και το GitHub στέλνει email στον διαχειριστή
# (Settings → Notifications → Actions: «Send notifications for failed workflows only»).
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Το site απαντά;
        run: |
          ok=0
          for i in 1 2 3; do
            code=$(curl -s -o page.html -w "%{http_code}" --max-time 25 -L https://tipoukeitostheo.gr/login || echo 000)
            if [ "$code" = "200" ] && grep -q "Τιπούκειτος\|BookStack\|login" page.html; then ok=1; break; fi
            echo "Προσπάθεια $i: HTTP $code"; sleep 30
          done
          if [ "$ok" != "1" ]; then echo "::error::Ο Τιπούκειτος δεν απαντά (HTTP $code)"; exit 1; fi
          echo "Το site λειτουργεί (HTTP 200)"
      - name: Ο βοηθός AI απαντά;
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 https://tipoukeitos-ai.tipoukeitos-ai.workers.dev/ || echo 000)
          echo "Βοηθός AI: HTTP $code"
          if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then echo "::error::Ο βοηθός AI δεν απαντά (HTTP $code)"; exit 1; fi
